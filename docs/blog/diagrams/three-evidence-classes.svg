<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three classes of evidence that do not mix: controlled experiments, load or capacity tests, and production telemetry — each answers a different question and must never be blended with the others.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1437"/><stop offset="1" stop-color="#2A1B57"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#bg2)"/>

  <rect x="60" y="42" width="54" height="5" rx="2.5" fill="#4FC3F7"/>
  <text x="60" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" font-weight="600" fill="#9FB3E8">EVIDENCE DISCIPLINE</text>
  <text x="60" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Three classes of evidence that do not mix</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Card 1: Controlled experiment -->
    <g filter="url(#sh2)">
      <rect x="60" y="120" width="340" height="300" rx="14" fill="url(#card2)" stroke="#4FC3F7" stroke-opacity="0.4"/>
      <rect x="60" y="120" width="340" height="8" rx="4" fill="#4FC3F7" fill-opacity="0.8"/>
      <text x="84" y="176" font-size="21" font-weight="700" fill="#FFFFFF">Controlled experiment</text>
      <text x="84" y="214" font-size="14" font-weight="700" fill="#7EC8F2">WHAT IT IS</text>
      <text x="84" y="238" font-size="15" fill="#C9D6F5">Sequential cases against a</text>
      <text x="84" y="258" font-size="15" fill="#C9D6F5">recorded manifest.</text>
      <text x="84" y="298" font-size="14" font-weight="700" fill="#7EC8F2">ANSWERS</text>
      <text x="84" y="322" font-size="15" fill="#C9D6F5">Which pattern/config is</text>
      <text x="84" y="342" font-size="15" fill="#C9D6F5">better, all else equal?</text>
      <text x="84" y="392" font-size="14" fill="#F2A9A0">Never blended with load rows</text>
    </g>
    <!-- Card 2: Load / capacity test -->
    <g filter="url(#sh2)">
      <rect x="430" y="120" width="340" height="300" rx="14" fill="url(#card2)" stroke="#7C4DFF" stroke-opacity="0.45"/>
      <rect x="430" y="120" width="340" height="8" rx="4" fill="#7C4DFF" fill-opacity="0.85"/>
      <text x="454" y="176" font-size="21" font-weight="700" fill="#FFFFFF">Load / capacity test</text>
      <text x="454" y="214" font-size="14" font-weight="700" fill="#B39DFF">WHAT IT IS</text>
      <text x="454" y="238" font-size="15" fill="#C9D6F5">Concurrent traffic with a</text>
      <text x="454" y="258" font-size="15" fill="#C9D6F5">named profile + saturation.</text>
      <text x="454" y="298" font-size="14" font-weight="700" fill="#B39DFF">ANSWERS</text>
      <text x="454" y="322" font-size="15" fill="#C9D6F5">How does it behave under</text>
      <text x="454" y="342" font-size="15" fill="#C9D6F5">N concurrent users?</text>
      <text x="454" y="392" font-size="14" fill="#F2A9A0">Never merged into sequential p95</text>
    </g>
    <!-- Card 3: Production telemetry -->
    <g filter="url(#sh2)">
      <rect x="800" y="120" width="340" height="300" rx="14" fill="url(#card2)" stroke="#39D98A" stroke-opacity="0.45"/>
      <rect x="800" y="120" width="340" height="8" rx="4" fill="#39D98A" fill-opacity="0.8"/>
      <text x="824" y="176" font-size="21" font-weight="700" fill="#FFFFFF">Production telemetry</text>
      <text x="824" y="214" font-size="14" font-weight="700" fill="#5FD39A">WHAT IT IS</text>
      <text x="824" y="238" font-size="15" fill="#C9D6F5">Observed user traffic in App</text>
      <text x="824" y="258" font-size="15" fill="#C9D6F5">Insights, Foundry, Search.</text>
      <text x="824" y="298" font-size="14" font-weight="700" fill="#5FD39A">ANSWERS</text>
      <text x="824" y="322" font-size="15" fill="#C9D6F5">What is actually happening</text>
      <text x="824" y="342" font-size="15" fill="#C9D6F5">in production?</text>
      <text x="824" y="392" font-size="14" fill="#F2A9A0">Never rebuilt into controlled p95</text>
    </g>
    <!-- "not equal" barriers -->
    <text x="415" y="278" text-anchor="middle" font-size="30" font-weight="800" fill="#F2A9A0" opacity="0.8">≠</text>
    <text x="785" y="278" text-anchor="middle" font-size="30" font-weight="800" fill="#F2A9A0" opacity="0.8">≠</text>
  </g>

  <text x="60" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#A9BAE6">A latency is “measured” only when a committed result records its manifest, sample count, environment, and measurement boundary.</text>
</svg>
